format = """
$fill$time$battery${custom.inhibit}${custom.bluetooth}${custom.wifi}${custom.profile}\
$line_break\
$username\
$hostname\
$shlvl\
$kubernetes\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$hg_branch\
$docker_context\
$package\
$cmake\
$dart\
$dotnet\
$elixir\
$elm\
$erlang\
$golang\
$helm\
$java\
$julia\
$kotlin\
$nim\
$nodejs\
$ocaml\
$perl\
$php\
$purescript\
$python\
$ruby\
$rust\
$swift\
$terraform\
$vagrant\
$zig\
$nix_shell\
$conda\
$memory_usage\
$aws\
$gcloud\
$openstack\
$lua\
$jobs\
$env_var\
$crystal\
$cmd_duration\
$line_break\
$status\
$character"""

command_timeout = 1000
scan_timeout = 5000

# Don't print a new line at the start of the prompt
add_newline = true

[lua]
symbol = "󰢱 "

[git_branch]
symbol = ' '              # branch symbol
style = 'bold purple'
truncation_length = 12     # shorten long branch names
truncation_symbol = '…'
always_show_remote = false

[git_commit]
commit_hash_length = 7 # show first 7 chars
tag_disabled = true    # disable tags for simplicity
style = 'bold green'

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = 'bold yellow'
merge = '[🔀 MERGING]'
rebase = '[🛠 REBASING]'
cherry_pick = '[🍒 PICKING]'
bisect = '[🔍 BISECTING]'
am = '[📫 APPLY]'
am_or_rebase = '[🔧 AM/REBASE]'

[git_status]
format = '([\[$all_status - $ahead_behind\]]($style) )| '
style = 'bold white'
staged = '[++($count)](green)'
modified = '[~($count)](yellow)'
deleted = '[✘($count)](red)'
renamed = '[»($count)](cyan)'
untracked = '[?($count)](magenta)'
conflicted = '[⚡($count)](red)'
stashed = '[💾($count)](blue)'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
up_to_date = '✓'

[git_metrics]
disabled = false
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '
added_style = 'bold green'
deleted_style = 'bold red'
only_nonzero_diffs = true
ignore_submodules = true

[fill]
symbol = ' '

# Make prompt a single line instead of two lines
[line_break]
disabled = false

# Replace the "❯" symbol in the prompt with "➜"
[character]
# The "success_symbol" segment is being set to "➜" with the color "bold green"
# use_symbol_for_status = true
# success_symbol = "[ ](bold blue)"
# error_symbol = "[ ](bold red)"
success_symbol = "[➜](bold blue)"
error_symbol = "[✘](bold red)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = false

# shows the hostname on new lines
[hostname]
# disabled = false
ssh_only = true
# format = "[$hostname]($style) in "
#style = "bold dimmed yellow"
# style = "bold blue"

# configure directory
[directory]
format = "[$path](bold blue)[$read_only]($read_only_style) "
home_symbol = "~ "

[cmd_duration]
format = "took [$duration]($style) "
style = "bold cyan"
disabled = false

[custom.inhibit]
when = 'pgrep -f "Yambar-Inhibit"'
command = 'echo "(ᴗ_ ᴗ。)ᶻ𝗓𐰁"'
style = "bold blue"
format = "[$output]($style) "

[custom.wifi]
command = 'echo "󰖩"'
when = 'iwctl station list | grep -q "connected"'
style = "bold cyan"
format = "[$output]($style) "

[custom.bluetooth]
command = 'echo "| "'
when = 'bluetoothctl info | grep -q "Connected: yes"'
style = "bold green"
format = "[$output]($style) "

[custom.profile]
command = '''
profile=$(tlpctl get)
if [ "$profile" = "performance" ]; then
    echo "(🔥_🔥)"
elif [ "$profile" = "power-saver" ]; then
    echo "(つ_-)zZ"
else
    echo "(・_・)"
fi
'''
when = "command -v tlpctl"
style = "bold yellow"
format = "[$output]($style) "

[time]
disabled = false
time_format = "%a %d.%m %R"
format = "[$time]($bold blue) "

[battery]
disabled = false
format = "[$percentage]($style) "
# full_symbol = "🔋"
# charging_symbol = "⚡️"
# discharging_symbol = "💀"

[[battery.display]]
threshold = 100
style = "bold white"

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

[username]
style_user = "bold blue"
style_root = "bold green"
format = "[$user]($style) on "
disabled = true
show_always = false

[status]
style = "bg:black"
symbol = "🔴"
format = '[\[$symbol $common_meaning$signal_name$maybe_int\]]($style) '
map_symbol = true
disabled = true


[palettes.vague]
background = "#141415"
lighter_background = "#252530"
red = "#d8647e"
green = "#7fa563"
yellow = "#f3be7c"
blue = "#6e94b2"
magenta = "#bb9dbd"
cyan = "#aeaed1"
light_gray = "#cdcdcd"
foreground = "#cdcdcd"

[palettes.everblush]
background = "#141b1e"
lighter_background = "#232a2d"
red = "#e57474"
green = "#8ccf7e"
yellow = "#e5c76b"
blue = "#67b0e8"
magenta = "#c47fd5"
cyan = "#6cbfbf"
light_gray = "#b3b9b8"
foreground = "#dadada"

palette = "vague"
