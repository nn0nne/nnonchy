# fcitx5 startups
exec_once= fcitx5 -d

# lxsession startup
exec_once=lxpolkit -a >/dev/null 2>&1 &

# udiskie startup
exec_once=udiskie -s >/dev/null 2>&1 &

# easyeffects startup
# exec_once=easyeffects --gapplication-service >/dev/null 2>&1 &

# fnott startup
exec_once=fnott >/dev/null 2>&1 &

# statusbar startup
# exec_once=pkill yambar; yambar >/dev/null 2>&1 &

# wallpaper
# exec_once=swaybg -i ~/.config/mango/wallpaper.png -m fit >/dev/null 2>&1 &

# Screen tearing
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=wlroots

exec_once=/usr/lib/xdg-desktop-portal-wlr &

## Clipboard manager
exec_once=wl-clip-persist --clipboard regular --reconnect-tries 0 &
exec_once=wl-paste --watch cliphist store &

# idle lock
exec_once=~/.config/mango/scripts/idle.sh &

# battery notifier startup
exec_once=~/.config/mango/scripts/battery-notifier.sh >/dev/null 2>&1 &
