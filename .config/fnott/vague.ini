stacking-order=top-down
anchor=top-right
edge-margin-vertical=0
edge-margin-horizontal=5
notification-margin=10
icon-theme=hicolor
max-icon-size=32
selection-helper=fuzzel --dmenu
border-radius=0
border-size=1
padding-vertical=12
padding-horizontal=15
title-font=monospace:size=10:style=bold
title-format=
summary-font=monospace:size=9:style=bold
summary-color=cdcdcdff
summary-format=<b>%s</b>
body-font=monospace:size=9
body-color=cdcdcdff
body-format=%b
progress-bar-height=4
progress-color=cdcdcdff

[low]
background=252530ff
border-color=878787ff
default-timeout=5

[normal]
background=252530ff
border-color=cdcdcdff
default-timeout=10

[critical]
background=252530ff
border-color=d8647eff
default-timeout=0
