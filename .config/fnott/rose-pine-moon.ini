stacking-order=top-down
anchor=top-right
edge-margin-vertical=0
edge-margin-horizontal=5
notification-margin=10
# icon-theme=RoséPine-Moon
max-icon-size=32
max-width=500
selection-helper=fuzzel --dmenu
border-radius=0
border-size=1
padding-vertical=12
padding-horizontal=15
title-font=monospace:size=10:style=bold
title-format=
summary-font=monospace:size=9:style=bold
summary-color=e0def4ff
summary-format=<b>%s</b>
body-font=monospace:size=9
body-color=c4c0dfff
body-format=%b
progress-bar-height=4
progress-color=9ccfd8ff

[low]
background=2a273fff
border-color=6e6a86ff
default-timeout=5

[normal]
background=2a273fff
border-color=44415aff
default-timeout=10

[critical]
background=2a273fff
border-color=eb6f92ff
default-timeout=0

