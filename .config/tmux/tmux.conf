# Props to https://github.com/kovidgoyal/kitty/issues/1915#issuecomment-2600996013
set -g update-environment "KITTY_LISTEN_ON KITTY_WINDOW_ID"

set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -as terminal-overrides ',xterm*:sitm=\E[3m'
set -g mouse on
set -g set-clipboard on

set -g history-limit 8000



unbind C-b
set -g prefix C-q
bind-key C-q send-prefix

# Vim like pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

# Change from 0 based to 1 based because keyboard layout
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

set -g status on
set -g status-position top
set -g status-interval 1
set -g status-left-length 100
# set -g status-right-length 100
set -g status-style "fg=white,bg=#1c1c24"
set -g status-justify absolute-centre

set -g message-style "fg=black,bg=cyan"

# set -g status-left "#[fg=black,bg=cyan]  #{USER} #[fg=white,bg=black]  #S #{prefix_highlight}"
# set -g status-left "#[fg=black,bg=cyan] (=^-ω-^=) #[fg=white,bg=black]  #{USER}"
set -g status-left "#[fg=black,bg=cyan] (=^-ω-^=) #[fg=white,bg=black]  #S"

# set -g status-right " #[fg=white,bg=black] 󰃭 %A %d %b #[fg=black,bg=cyan] 󰥔 %H:%M "
set -g status-right ""

setw -g window-status-separator " "
setw -g window-status-format "#[fg=black,bg=brightwhite] #(~/.config/tmux/scripts/numjap.sh #{window_index}) #[fg=white,bg=black] #W "
setw -g window-status-current-format "#[fg=black,bg=yellow] #(~/.config/tmux/scripts/numjap.sh #{window_index}) #[fg=white,bg=black] #W "
# setw -g window-status-format "#[fg=black,bg=brightwhite] #I #[fg=white,bg=black] #W "
# setw -g window-status-current-format "#[fg=black,bg=yellow] #I #[fg=white,bg=black] #W "
set -g mode-style "fg=black,bg=cyan"

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=black]#[bg=yellow]"
set -g @prefix_highlight_output_suffix ""

set -g pane-border-lines double
set -g pane-active-border-style "fg=blue"  
set -g pane-border-indicators colour
set -g pane-border-status off


# plugins
run-shell /home/nnonne/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell /home/nnonne/.config/tmux/plugins/tmux-continuum/continuum.tmux

set -g @continuum-restore 'on' # auto restore
