colourful: false

filekinds:
  normal: { foreground: "#BBBBBB" }        # Main Light Gray text
  directory: { foreground: "#E5E5E5" }     # Brighter gray so directories stand out
  symlink: { foreground: "#8E8E8E" }       # Mid Gray for links
  pipe: { foreground: "#666666" }          # Darker Gray
  block_device: { foreground: "#FFFFFF" }  # Pure White (Alert/Special)
  char_device: { foreground: "#FFFFFF" }   # Pure White
  socket: { foreground: "#666666" }
  special: { foreground: "#E5E5E5" }
  executable: { foreground: "#FFFFFF" }    # Pure White to pop out in file lists
  mount_point: { foreground: "#8E8E8E" }

perms:
  user_read: { foreground: "#BBBBBB" }      # Visible primary perms
  user_write: { foreground: "#BBBBBB" }
  user_execute_file: { foreground: "#FFFFFF" } # Execute bit stands out clearly
  user_execute_other: { foreground: "#FFFFFF" }
  group_read: { foreground: "#8E8E8E" }     # Stepped down to Mid Gray
  group_write: { foreground: "#8E8E8E" }
  group_execute: { foreground: "#8E8E8E" }
  other_read: { foreground: "#3D3839" }     # Low contrast
  other_write: { foreground: "#3D3839" }
  other_execute: { foreground: "#3D3839" }
  special_user_file: { foreground: "#FFFFFF" }
  special_other: { foreground: "#666666" }
  attribute: { foreground: "#8E8E8E" }

size:
  major: { foreground: "#8E8E8E" }
  minor: { foreground: "#666666" }
  number_byte: { foreground: "#BBBBBB" }
  number_kilo: { foreground: "#BBBBBB" }
  number_mega: { foreground: "#E5E5E5" }    # Gets brighter as the files
  number_giga: { foreground: "#FFFFFF" }    # get larger so huge files
  number_huge: { foreground: "#FFFFFF" }    # catch your eye instantly
  unit_byte: { foreground: "#3D3839" }      # Low contrast units
  unit_kilo: { foreground: "#666666" }
  unit_mega: { foreground: "#8E8E8E" }
  unit_giga: { foreground: "#BBBBBB" }
  unit_huge: { foreground: "#E5E5E5" }

users:
  user_you: { foreground: "#BBBBBB" }
  user_root: { foreground: "#FFFFFF" }      # Alert text for root
  user_other: { foreground: "#666666" }
  group_yours: { foreground: "#8E8E8E" }
  group_other: { foreground: "#3D3839" }
  group_root: { foreground: "#FFFFFF" }

links:
  normal: { foreground: "#8E8E8E" }
  multi_link_file: { foreground: "#BBBBBB" }

git:
  new: { foreground: "#E5E5E5" }           # Bright clean add
  modified: { foreground: "#BBBBBB" }      # Standard gray modification
  deleted: { foreground: "#666666" }       # Faded gray deletion
  renamed: { foreground: "#8E8E8E" }
  typechange: { foreground: "#8E8E8E" }
  ignored: { foreground: "#3D3839" }        # Pushed far into background
  conflicted: { foreground: "#FFFFFF" }     # Needs immediate attention

git_repo:
  branch_main: { foreground: "#BBBBBB" }
  branch_other: { foreground: "#8E8E8E" }
  git_clean: { foreground: "#8E8E8E" }
  git_dirty: { foreground: "#FFFFFF" }     # Alert

security_context:
  colon: { foreground: "#3D3839" }
  user: { foreground: "#666666" }
  role: { foreground: "#8E8E8E" }
  typ: { foreground: "#666666" }
  range: { foreground: "#8E8E8E" }

file_type:
  image: { foreground: "#BBBBBB" }
  video: { foreground: "#BBBBBB" }
  music: { foreground: "#BBBBBB" }
  lossless: { foreground: "#BBBBBB" }
  crypto: { foreground: "#666666" }
  document: { foreground: "#E5E5E5" }       # Important files slightly brighter
  compressed: { foreground: "#8E8E8E" }
  temp: { foreground: "#3D3839" }           # Temp files disappear into background
  compiled: { foreground: "#666666" }
  build: { foreground: "#666666" }
  source: { foreground: "#E5E5E5" }         # Code files stand out slightly more

punctuation: { foreground: "#3D3839" }    # Muted structural punctuation
date: { foreground: "#8E8E8E" }
inode: { foreground: "#3D3839" }
blocks: { foreground: "#3D3839" }
header: { foreground: "#BBBBBB" }
octal: { foreground: "#8E8E8E" }
flags: { foreground: "#8E8E8E" }

symlink_path: { foreground: "#8E8E8E" }
control_char: { foreground: "#BBBBBB" }
broken_symlink: { foreground: "#FFFFFF" }  # High contrast warning
broken_path_overlay: { foreground: "#191919" }
