format = """
$username\
$hostname\
$shlvl\
$mise\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$hg_branch\
$docker_context\
$package\
$dart\
$java\
$kotlin\
$nodejs\
$lua\
$jobs\
$env_var\
$cmd_duration\
$fill${custom.docker}${custom.time_day}${custom.time_date}${custom.time_clock}$battery${custom.inhibit}| ${custom.bluetooth}${custom.wifi}${custom.profile}${custom.vesktop}\
$line_break\
$status\
$character"""

command_timeout = 5000
scan_timeout = 5000

# Don't print a new line at the start of the prompt
add_newline = true

palette = "rose-pine-moon"

[profiles]
transient="""
$character\
"""

[git_branch]
symbol = " "
format = '\[[$symbol$branch]($style)\]'
style = 'bold iris'
truncation_length = 12                  # shorten long branch names
truncation_symbol = '…'
always_show_remote = false

[git_commit]
format = '\[[\($hash$tag\)]($style)\]'
tag_symbol = '  '
commit_hash_length = 7                 # show first 7 chars
tag_disabled = true                    # disable tags for simplicity
style = 'bold foam'

[git_state]
format = '\[[$state ($progress_current/$progress_total)]($style)\]'
style = 'bold gold'
merge = '🔀'
rebase = '🛠'
cherry_pick = '🍒'
bisect = '🔍'
am = '📫'
am_or_rebase = '🔧'

[git_status]
format = '([\[$all_status - $ahead_behind\]]($style))'
style = 'bold rose'
staged = '[++($count)](foam)'
modified = '[~($count)](gold)'
deleted = '[✘($count)](love)'
renamed = '[»($count)](pine)'
untracked = '[?($count)](iris)'
conflicted = '[⚡($count)](love)'
stashed = '[💾($count)](pine)'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
up_to_date = '✓'

[git_metrics]
disabled = false
format = '\[[+$added]($added_style)/[-$deleted]($deleted_style)\]'
added_style = 'bold foam'
deleted_style = 'bold love'
only_nonzero_diffs = true
ignore_submodules = true

[fill]
symbol = ' '

# Make prompt a single line instead of two lines
[line_break]
disabled = false

[character]
success_symbol = "[➜](bold foam)"
error_symbol = "[➜](bold love)"

# Disable the package module, hiding it from the prompt completely
[package]
symbol = "󰏗 "
format = '\[[$symbol$version]($style)\]'
disabled = false

# shows the hostname on new lines
[hostname]
ssh_only = true
ssh_symbol = " "
format = '\[[$ssh_symbol($hostname)]($style)\] '

# configure directory
[directory]
read_only = " 󰌾"
format = "[$path](bold iris)[$read_only]($read_only_style) "
home_symbol = "~"

[cmd_duration]
format = " took [$duration]($style)"
style = "bold gold"
disabled = false

[custom.inhibit]
when = 'pgrep -f "Yambar-Inhibit"'
command = 'echo "(ᴗ_ ᴗ。)"'
style = "bold foam"
format = "[$output]($style) "
shell = ["zsh"]

[custom.wifi]
command = 'echo "󰖩"'
when = 'iwctl station list | grep -q "connected"'
style = "bold foam"
format = "[$output]($style) "
shell = ["zsh"]

[custom.bluetooth]
command = 'echo ""'
when = 'bluetoothctl info | grep -q "Connected: yes"'
style = "bold pine"
format = "[$output]($style) "
shell = ["zsh"]

[custom.profile]
command = '''
profile=$(tlpctl get)
if [ "$profile" = "performance" ]; then
    echo "(🔥_🔥)"
elif [ "$profile" = "power-saver" ]; then
    echo "(つ_-)"
else
    echo "(・_・)"
fi
'''
when = "command -v tlpctl"
style = "bold rose"
format = "[$output]($style) "
shell = ["zsh"]

[custom.time_day]
command = "printf 0$(date +%u)"
when = true
style = "foam"
format = "[$output]($style)"
shell = ["zsh"]

[custom.cat]
command = 'echo "ᓚ₍ ^. ̫ .^₎"'
when = true
shell = ["zsh"]
style = "bold rose"
format = "[$output]($style)"

[custom.time_date]
command = "printf $(date +%d%m)"
when = true
style = "bold iris"
format = "[$output]($style)"
shell = ["zsh"]

[custom.time_clock]
command = "printf $(date +%H%M)"
when = true
style = "bold foam"
format = "[$output]($style) "    # Exactly one trailing space to separate it from the battery component
shell = ["zsh"]

[custom.docker]
command = "echo ' '"
when = "systemctl is-active --quiet docker.service"
style = "bold pine"
format = "[$output]($style) | "
shell = ["zsh"]

[custom.vesktop]
command = "pgrep -x vesktop >/dev/null && echo '󰙯' || true"
when = "pgrep -x vesktop >/dev/null"
format = "| [$output]($style) "
style = "bold"
shell = ["sh"]

[time]
disabled = true

[battery]
disabled = false
format = "[$percentage $symbol]($style)"
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 100
style = "bold foam"

[[battery.display]]
threshold = 10
style = "bold love"

[[battery.display]]
threshold = 30
style = "bold gold"

[username]
style_user = "bold iris"
style_root = "bold love"
format = "[$user]($style) on "
disabled = true
show_always = false

[status]
style = "love"
symbol = " "
format = '[\[$symbol\]]($style) '
map_symbol = false
disabled = true

[dart]
symbol = " "
format = '\[[$symbol($version)]($style)\]'

[docker_context]
symbol = " "
format = '\[[$symbol$context]($style)\]'

[gradle]
symbol = " "
format = '\[[$symbol($version)]($style)\]'

[hg_branch]
symbol = " "
format = '\[[$symbol$branch]($style)\]'

[java]
symbol = " "
format = '\[[$symbol($version)]($style)\]'

[lua]
symbol = " "
format = '\[[$symbol($version)]($style)\]'

[mise]
disabled = false
format = '\[[$symbol$health]($style)\] '
healthy_symbol = '󰄬 '    # nf-md-check_bold (A clean checkmark)
unhealthy_symbol = '󰅙 '  # nf-md-close_box (A clean X mark)
style = 'bold foam'     # Keeps the default color, or change to whatever you like

[nodejs]
symbol = " "
format = '\[[$symbol($version)]($style)\]'

[shell]
format = '\[[$indicator]($style)\]'

[sudo]
symbol = " "
format = '\[[as $symbol]($style)\]'

[palettes.rose-pine-moon]
# overlay = '#393552'
love = '#eb6f92'
gold = '#f6c177'
rose = '#ea9a97'
pine = '#3e8fb0'
foam = '#9ccfd8'
iris = '#c4a7e7'
