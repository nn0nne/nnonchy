# More option see https://github.com/DreamMaoMao/mango/wiki/

# fcitx stuff
# env=GTK_IM_MODULE,fcitx
env=QT_IM_MODULE,fcitx
env=SDL_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=GLFW_IM_MODULE,ibus

# ### screen scale stuff ###
# env=QT_AUTO_SCREEN_SCALE_FACTOR,1
# env=QT_WAYLAND_FORCE_DPI,100
#
# # start xwayland
# exec=/usr/sbin/xwayland-satellite :11 &
# # scale 1 for xwayland
# exec=sleep 0.5s && echo "Xft.dpi: 100" | xrdb -merge
# exec=gsettings set org.gnome.desktop.interface text-scaling-factor 1
# ### screen scale stuff ###


# lxsession startup
exec-once=lxsession &

# udiskie startup
exec-once=udiskie &

# easyeffects startup
exec=easyeffects --gapplication-service >/dev/null 2>&1 &

# notification daemon startup
# exec-once=swaync &
exec-once=wired -r
# exec-once=bash ~/.config/mango/scripts/music_daemon.sh >/dev/null 2>&1 &

# waybar startup
exec=pkill waybar; waybar >/dev/null 2>&1 &

# gammastep indo setup
# exec-once=gammastep >/dev/null 2>&1 &

# wallpaper
exec=pkill swaybg; swaybg -i ~/.config/mango/wallpaper.png -m fill >/dev/null 2>&1 &

# Screen tearing
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=wlroots

exec-once=/usr/lib/xdg-desktop-portal-wlr &

## Clipboard manager
# Keep clipboard content after app closes
exec-once=wl-clip-persist --clipboard regular --reconnect-tries 0 &
# Watch clipboard and store history
exec-once=wl-paste --watch cliphist store &

# idle lock
exec=swayidle -w timeout 300 'swaylock --clock --indicator -f' timeout 600 'wlr-randr --output eDP-1 --off' resume 'wlr-randr --output eDP-1 --on' timeout 1800 'systemctl suspend' before-sleep 'swaylock --clock --indicator -f'

# exec-once=nm-applet &

# monitor rule
monitorrule=name:eDP-1,width:1920,height:1080,refresh:60,x:0,y:0,scale:1,rr:0

# bluetui bind
bind=super+shift,b,spawn,foot -e bluetui

# impala bind
bind=super+shift,w,spawn,foot -e impala

# refresh rate bind
bind=SUPER,F5,spawn_shell,wlr-randr --output eDP-1 --mode 1920x1080@60.019001Hz && notify-send "Refresh Rate" "Set to 60" -t 2000
bind=SUPER,F6,spawn_shell,wlr-randr --output eDP-1 --mode 1920x1080@144.003006Hz && notify-send "Refresh Rate" "Set to 144" -t 2000

# toggle gammastep
bind=SUPER+SHIFT,g,spawn_shell,~/.config/mango/scripts/toggle-gammastep.sh >/dev/null 2>&1 &

# toggle tws
bind=SUPER,b,spawn_shell,~/.config/mango/scripts/toggle-tws.sh >/dev/null 2>&1 &

# dimming
bind=SUPER,F1,spawn_shell,notify-send "Dim" "Enabled" -t 1000 && dim -p -d 0  
bind=SUPER,F2,spawn_shell,pkill dim && notify-send "Dim" "Disabled" -t 1000

# screenshot bindings
bind=SUPER,s,spawn_shell,grim -l 0 -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Copied to clipboard" -t 1000
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%m-%s).png && notify-send "Screenshot" "Saved to the folder" -t 1000
bind=SUPER+CTRL+SHIFT,s,spawn_shell,grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%m-%s).png && notify-send "Screenshot (W)" "Copied to clipboard" -t 1000
bind=SUPER+CTRL,s,spawn_shell,grim - | wl-copy && notify-send "Screenshot (W)" "Saved to the folders" -t 1000

# brightness bindings
binds=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 1%+
binds=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 1%-

# volume binding
binds=NONE,XF86AudioRaiseVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ +1%
binds=NONE,XF86AudioLowerVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ -1%
binds=NONE,XF86AudioMute,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle

# tws binding
binds=NONE,XF86AudioNext,spawn,playerctl next
binds=NONE,XF86AudioPrev,spawn,playerctl previous
binds=NONE,XF86AudioPlay,spawn,playerctl play
binds=NONE,XF86AudioPause,spawn,playerctl pause


# clipboard manager
# binds=SUPER,v,spawn_shell,cliphist list | wmenu -f "JetBrainsMono Nerd Font Mono 10" -l 5 -N 1d2021FF -n d4be98FF -S d4be98FF -s 1d2021 | cliphist decode | wl-copy
binds=SUPER,v,spawn_shell,cliphist list | rofi -dmenu -i -lines 5 | cliphist decode | wl-copy

# Window effect
blur=0
blur_layer=0
blur_optimized=0
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.9

# Animation Configuration(support type:zoom,slide, fade, none)
# tag_animation_direction: 0-horizontal,1-vertical
animations=0
layer_animations=0
animation_type_open=fade
animation_type_close=fade
layer_animation_type_open=fade
layer_animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=5
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=0
default_mfact=0.5
default_nmaster=1
smartgaps=1
center_master_overspread=1
center_when_single_stack=1

# Overview Setting
hotarea_size=10
hotarea_corner=3
enable_hotarea=0
ov_tab_mode=1
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=0
idleinhibit_ignore_visible=0
sloppyfocus=0
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
xwayland_persistence=1
syncobj_enable=1
view_current_to_back=1
allow_tearing=1


# keyboard
repeat_rate=35
repeat_delay=300
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=0
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=20

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
accel_speed=0.5

# Appearance
gappih=0
gappiv=0
gappoh=0
gappov=0
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=1
rootcolor=0x141415ff
bordercolor=0x252530ff
focuscolor=0x8ba9c1ff
maximizescreencolor=0xaeaed1ff
urgentcolor=0xd8647eff
scratchpadcolor=0xc9b1caff
globalcolor=0xbb9dbdff
overlaycolor=0x606079ff
# bordercolor=0x444444ff
# focuscolor=0xc9b890ff
# maximizescreencolor=0x89aa61ff
# urgentcolor=0xad401fff
# scratchpadcolor=0x516c93ff
# globalcolor=0xb153a7ff
# overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
# bind=SUPER,d,spawn_shell,wmenu-run -f "JetBrainsMono Nerd Font Mono 12" -l 3 -N 1d2021FF -n d4be98FF -S d4be98FF -s 1d2021
bind=SUPER,d,spawn_shell,rofi -l 5 -show drun 
bind=SUPER+shift,d,spawn_shell,rofi -modi emoji -show emoji
bind=SUPER+ctrl,d,spawn_shell,rofi -show calc -modi calc -no-show-match -no-sort
# bind=SUPER,Return,spawn,kitty
bind=SUPER,Return,spawn,foot

# exit
bind=SUPER+SHIFT,e,spawn,~/.config/mango/scripts/power-menu.sh
bind=SUPER+SHIFT,q,killclient

# switch window focus
# bind=SUPER,Tab,focusstack,next
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,Tab,toggleoverview,
bind=SUPER+SHIFT,space,togglefloating,
bind=SUPER+SHIFT,f,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER+Ctrl,f,togglefakefullscreen,
bind=SUPER,minus,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,minus,restore_minimized
bind=SUPER,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# switch layout
# bind=SUPER,n,switch_layout
bind=SUPER+ALT,1,setlayout,tile
bind=SUPER+ALT,2,setlayout,scroller
bind=SUPER+ALT,3,setlayout,tgmix
bind=SUPER+ALT,4,setlayout,center_tile
bind=SUPER+ALT,5,setlayout,monocle
bind=SUPER+ALT,6,setlayout,deck

# tag switch
# bind=SUPER,bracketleft,viewtoleft,0
bind=SUPER,bracketleft,viewtoleft_have_client,0
# bind=SUPER,bracketright,viewtoright,0
bind=SUPER,bracketright,viewtoright_have_client,0
bind=SUPER+SHIFT,bracketleft,tagtoleft,0
bind=SUPER+SHIFT,bracketright,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
bind=SUPER+Alt,Left,focusmon,left
bind=SUPER+Alt,Right,focusmon,right
bind=SUPER+Alt+Ctrl,Left,tagmon,left
bind=SUPER+Alt+Ctrl,Right,tagmon,right

# gaps
# bind=ALT+SHIFT,X,incgaps,1
# bind=ALT+SHIFT,Z,incgaps,-1
# bind=ALT+SHIFT,R,togglegaps

# movewin
# bind=SUPER+Ctrl,k,movewin,+0,-50
# bind=SUPER+Ctrl,j,movewin,+0,+50
# bind=SUPER+Ctrl,h,movewin,-50,+0
# bind=SUPER+Ctrl,l,movewin,+50,+0

# resizewin
bind=CTRL+SUPER,k,resizewin,+0,-50
bind=CTRL+SUPER,j,resizewin,+0,+50
bind=CTRL+SUPER,h,resizewin,-50,+0
bind=CTRL+SUPER,l,resizewin,+50,+0

# Mouse Button Bindings
# NONE mode key only work in ov mode
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize
# mousebind=NONE,btn_left,toggleoverview,1
# mousebind=NONE,btn_right,killclient,0

# Axis Bindings
# axisbind=SUPER,UP,viewtoleft_have_client
# axisbind=SUPER,DOWN,viewtoright_have_client

# Window Rule for apps
windowrule=tags:9,istagsilent:1,ignore_maximize:1,appid:vesktop
windowrule=tags:9,istagsilent:1,ignore_maximize:1,appid:hnpfjngllnobngcgfapefoaidbinmjnm
windowrule=tags:9,istagsilent:1,ignore_maximize:1,appid:ibblmnobmgdmpoeblocemifbpglakpoi
windowrule=tags:8,istagsilent:1,ignore_maximize:1,appid:cinhimbnkkaeohfgghhklpknlkffjgod
windowrule=tags:8,istagsilent:1,ignore_maximize:1,appid:agimnkijcaahngcdmfeangaknmldooml
windowrule=tags:8,istagsilent:1,ignore_maximize:1,appid:eikjhbkpemdappjfcmdeeeamdpkgabmk
windowrule=tags:8,istagsilent:1,ignore_maximize:1,appid:pjibgclleladliembfgfagdaldikeohf
windowrule=tags:7,istagsilent:1,isfullscreen:1,scroller_proportion:1.0,force_tearing:1,appid:osu*
windowrule=tags:7,istagsilent:1,ignore_maximize:1,appid:Lutris
