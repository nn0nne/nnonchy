prSections:
    - title: Pull Requests
      filters: is:open 
    - title: My Pull Requests
      filters: is:open author:@me
    - title: Needs My Review
      filters: is:open review-requested:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
issuesSections:
    - title: Issues
      filters: is:open
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
notificationsSections:
    - title: All
      filters: ""
    - title: Created
      filters: reason:author
    - title: Participating
      filters: reason:participating
    - title: Mentioned
      filters: reason:mention
    - title: Review Requested
      filters: reason:review-requested
    - title: Assigned
      filters: reason:assign
    - title: Subscribed
      filters: reason:subscribed
    - title: Team Mentioned
      filters: reason:team-mention
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: false
        width: 0.7
        height: 0.6
        position: auto
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    notificationsLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            labels:
                width: 22
                hidden: true
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
keybindings: {}
repoPaths: {}
theme:
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
    colors:
        text:
          primary: "#cdcdcd"  
          secondary: "#878787"
          inverted: "#141415" 
          faint: "#606079"    
          warning: "#f3be7c"  
          success: "#7fa563"  
          actor: "#90a0b5"    
        background:
          selected: "#252530" 
        border:
          primary: "#333738"  
          secondary: "#252530"
          faint: "#1c1c24"    
        inline:
          icons:
            newcontributor: "#aeaed1"
            contributor: "#9bb4bc"   
            collaborator: "#7e98e8"  
            member: "#bb9dbd"        
            owner: "#e0a363"         
            unknownrole: "#606079"   
    icons:
        inline:
          newcontributor: "󰎔"
          contributor: ""
          collaborator: ""
          member: ""
          owner: ""
          unknownrole: "󰭙"
pager:
    diff: ""
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
