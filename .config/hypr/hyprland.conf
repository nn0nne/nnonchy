# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=eDP-1,highres@60,0x0,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# TODO:
exec = pkill waybar; waybar -c ~/.config/waybar/config-hyprland.jsonc >/dev/null 2>&1 &
exec=pkill swaybg; swaybg -i ~/.config/mango/wallpaper.png -m fill >/dev/null 2>&1 &

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# env = LIBVA_DRIVER_NAME,nvidia
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# https://wiki.hypr.land/Configuring/Variables/#ecosystem
ecosystem {
    enforce_permissions = false # NOTE: Checkout hyprland-guiutils (https://wiki.hypr.land/Configuring/Permissions/)
    no_update_news = false
    no_donation_nag = true
}

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 0
    gaps_out = 0
    float_gaps = 0
    gaps_workspaces = 0
    border_size = 1

    # TODO:
    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = scrolling # dwindle/master/scrolling/monocle
    no_focus_fallback = false
    resize_corner = 0
    modal_parent_blocking = true
    locale = en_US

    resize_on_border = false
    extend_border_grab_area = 15
    hover_icon_on_border = true


    # TODO: 
    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    col.nogroup_border = rgba(595959aa)
    col.nogroup_border_active = rgba(33ccffee) rgba(00ff99ee) 45deg

    snap {
        enabled = true
        window_gap = 30
        monitor_gap = 30
        border_overlap = false
        respect_gaps = false
    }

}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 0
    rounding_power = 0

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    dim_modal = true
    dim_inactive = false
    dim_strength = 0.05
    dim_special = 0.2
    dim_around = 0.4

    border_part_of_window = true

    shadow {
        enabled = false
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = false
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = false
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

layout {
    single_window_aspect_ratio = 0 0
    single_window_aspect_ratio_tolerance = 0.1
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
# dwindle {
#     pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
#     preserve_split = true # You probably want this
# }

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
# master {
#     new_status = master
# }

# See https://wiki.hypr.land/Configuring/Scrolling-Layout/ for more
scrolling {
    fullscreen_on_one_column = false
    column_width = 0.5
    focus_fit_method = 1
    follow_focus = true
    follow_min_visible = 0.4
    explicit_column_widths = 0.5, 0.75, 1.0
    direction = right
}

# See https://wiki.hypr.land/Configuring/Monocle-Layout/ for more

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    col.splash = 0xffffffff
    splash_font_family = 
    disable_scale_notification = false
    font_family = JetBrainsMono Nerd Font
    vfr = true
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    name_vk_after_proc = true
    always_follow_on_dnd = true
    layers_hog_keyboard_focus = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    disable_autoreload = false 
    enable_swallow = false
    swallow_regex =
    swallow_exception_regex =
    focus_on_activate = false
    mouse_move_focuses_monitor = true
    allow_session_lock_restore = true
    session_lock_xray = false
    close_special_on_empty = true
    on_focus_under_fullscreen = 2
    exit_window_retains_fullscreen = false
    initial_workspace_tracking = 1
    middle_click_paste = true
    render_unfocused_fps = 15
    disable_xdg_env_checks = false
    enable_anr_dialog = true
    anr_missed_pings = 5
    size_limits_tiled = false
    disable_watchdog_warning = false

    # TODO:
    # background_color =
}

# https://wiki.hypr.land/Configuring/Variables/#cursor
cursor {
    invisible = false
    sync_gsettings_theme = true
    no_hardware_cursors = 2
    no_break_fs_vrr = 2
    min_refresh_rate = 24
    hotspot_padding = 1
    inactive_timeout = 60
    no_warps = false
    persistent_warps = false
    warp_on_change_workspace = 1
    warp_on_toggle_special = 1
    default_monitor =
    zoom_factor = 1
    zoom_rigid = false
    zoom_detached_camera = true
    enable_hyprcursor = true # TODO: checkout hyprcursor
    hide_on_key_press = true
    hide_on_touch = true
    use_cpu_buffer = 2
    warp_back_after_non_mouse_input = false
    zoom_disable_aa = false
}

# https://wiki.hypr.land/Configuring/Variables/#xwayland
xwayland {
    enabled = true
    use_nearest_neighbor = true
    force_zero_scaling = false
    create_abstract_socket = false
}

# https://wiki.hypr.land/Configuring/Variables/#opengl
opengl {
    nvidia_anti_flicker = true
}

# https://wiki.hypr.land/Configuring/Variables/#render
render {
    direct_scanout = 2 # NOTE: content type need to be game
    expand_undersized_textures = true
    xp_mode = false
    ctm_animation = 2
    cm_fs_passthrough = 2
    cm_enabled = true
    send_content_type = true
    cm_auto_hdr = 1
    new_render_scheduling = false
    non_shader_cm = 3
    cm_sdr_eotf = default
    commit_timing_enabled = true
}

# https://wiki.hypr.land/Configuring/Variables/#quirks
quirks {
    prefer_hdr = 0
}

#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
# Keyboards and mouse
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = false
    resolve_binds_by_sym = false
    repeat_rate = 35
    repeat_delay = 300
    sensitivity = 0 
    accel_profile = 
    force_no_accel = false
    rotation = 0
    left_handed = false
    scroll_points = 
    scroll_method = 2fg
    scroll_button = 0
    scroll_button_lock = false
    scroll_factor = 3
    natural_scroll = false
    follow_mouse = 1
    follow_mouse_threshold = 1000.0
    focus_on_close = 0
    mouse_refocus = false
    float_switch_override_focus = 1
    special_fallthrough = false
    off_window_axis_events = 1
    emulate_discrete_scroll = 1

    touchpad {
        disable_while_typing = true
        natural_scroll = true
        scroll_factor = 1
        middle_button_emulation = false
        tap_button_map = lrm
        clickfinger_behavior = false
        tap-to-click = true
        drag_lock = 2
        tap-and-drag = true
        flip_x = false
        flip_y = false
        drag_3fg = 2
    }

    virtualkeyboard {
        share_states = 2
        release_pressed_on_close = false
    }
}

# https://wiki.hypr.land/Configuring/Variables/#binds
binds {
    pass_mouse_when_bound = false
    scroll_event_delay = 300
    workspace_back_and_forth = true
    hide_special_on_workspace_change = true
    allow_workspace_cycles = true
    workspace_center_on = 0
    focus_preferred_method = 0
    ignore_group_lock = false
    movefocus_cycles_fullscreen = false
    movefocus_cycles_groupfirst = false
    window_direction_monitor_fallback = true
    disable_keybind_grabbing = false
    allow_pin_fullscreen = false
    drag_threshold = 0
}

# See https://wiki.hypr.land/Configuring/Gestures
# gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
# device {
#     name = epic-mouse-v1
#     sensitivity = -0.5
# }


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod SHIFT,Z,exec, hyprctl reload

bind = $mainMod SHIFT, E, exec, ~/.config/hypr/scripts/power-menu.sh

# screenshot bindings
bind=$mainMod,S,exec,grim -l 0 -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Copied to clipboard" -t 1000
bind=$mainMod SHIFT,S,exec,grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%m-%s).png && notify-send "Screenshot" "Saved to the folder" -t 1000
bind=$mainMod CTRL SHIFT,S,exec,grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%m-%s).png && notify-send "Screenshot (W)" "Copied to clipboard" -t 1000
bind=$mainMod CTRL,S,exec,grim - | wl-copy && notify-send "Screenshot (W)" "Saved to the folders" -t 1000

bind=$mainMod, F, fullscreen, 0
bind=$mainMod SHIFT, F, fullscreen, 1


# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod Shift, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = Alt, V, togglefloating,
bind = $mainMod, D, exec, $menu

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Monocle
bind = Alt, K, layoutmsg, cyclenext
bind = Alt, J, layoutmsg, cycleprev

bind = $mainMod, comma, togglegroup

# Scrolling
bind = $mainMod SHIFT, H, layoutmsg, swapcol l
bind = $mainMod SHIFT, L, layoutmsg, swapcol r
bind = Alt, X, layoutmsg, colresize +conf
bind = Alt, E, layoutmsg, fit active
bind = Alt Ctrl, H, layoutmsg, colresize -0.1
bind = Alt Ctrl, L, layoutmsg, colresize +0.1

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, t
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod SHIFT, Minus, togglespecialworkspace, magic
bind = $mainMod, Minus, movetoworkspace, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 1%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 1%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
