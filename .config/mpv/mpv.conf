
# -------- Core --------
vo=gpu-next
gpu-api=vulkan
hwdec=off

profile=fast

# -------- Scaling --------
scale=bilinear
cscale=bilinear
dscale=bilinear
sws-scaler=fast-bilinear

deband=no
dither=no
interpolation=no

# -------- HDR / tone mapping --------
tone-mapping=clip
hdr-compute-peak=no
correct-downscaling=no
linear-downscaling=no
sigmoid-upscaling=no

# -------- Decoder --------
vd-lavc-fast=yes
vd-lavc-threads=4

# -------- Audio --------
audio-channels=auto-safe
audio-pitch-correction=no

# -------- Cache --------
cache=yes
demuxer-max-bytes=32M
demuxer-max-back-bytes=16M
demuxer-readahead-secs=1

# -------- Subtitles --------
sub-ass=no
embeddedfonts=no
sub-auto=no

# -------- OSD --------
osd-level=1
osd-bar=no

# -------- General --------
save-position-on-quit=no
keep-open=always

screenshot-directory=""
screenshot-template="%F"

autocreate-playlist=same
osc=no
osd-level=1
border=no
screenshot-sw=yes
screenshot-format=jpg
screenshot-high-bit-depth=no
video-sync=display-desync   # Stops trying to perfectly sync frames (saves cycles)
framedrop=vo                # Drop frames if the system gets even slightly busy
swapchain-depth=1           # Reduces the amount of frames the iGPU holds in queue
gpu-dumb-mode=yes
target-colorspace-hint=no

reset-on-next-file=video-pan-x,video-pan-y,video-zoom,video-rotate
