
# -------- Core --------
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe
profile=fast

# -------- Scaling --------
scale=bilinear
cscale=bilinear
dscale=bilinear

deband=no
dither=no
interpolation=no

# -------- HDR / tone mapping --------
tone-mapping=auto
hdr-compute-peak=no

# -------- Decoder --------
vd-lavc-fast=yes
vd-lavc-threads=0
vd-lavc-skiploopfilter=all

# -------- Audio --------
audio-channels=auto-safe
audio-pitch-correction=no

# -------- Cache --------
cache=yes
demuxer-max-bytes=16M
demuxer-max-back-bytes=8M

# -------- Subtitles --------
sub-ass=no
embeddedfonts=no
sub-auto=no

# -------- OSD --------
osd-level=1
osd-bar=no

# -------- General --------
save-position-on-quit=no
keep-open=yes

screenshot-directory="~/Pictures/Screenshots/"
